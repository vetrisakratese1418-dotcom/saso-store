services:
  - type: web
    name: saso-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@shopora.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ALLOW_TEST_PAYMENTS
        value: "true"
